<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise Birthday Gift Reveal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* LOCK SCREEN (STRICT SCRATCH BOX - NO TEXT) */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #00050d; z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        .canvas-container {
            position: relative; width: 230px; height: 230px; border-radius: 20px;
            border: 2px dashed #00bfff; box-shadow: 0 0 25px rgba(0, 191, 255, 0.5);
            background: rgba(0, 15, 30, 0.9); overflow: hidden;
            touch-action: none;
        }
        #scratchCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }

        .clear-btn {
            margin-top: 15px; background: transparent; border: 1px solid #00bfff;
            color: #b3f0ff; padding: 5px 12px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;
        }

        /* GIFT SCREEN */
        #gift-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #001f3d 0%, #000205 85%);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.8s ease;
            opacity: 0; pointer-events: none;
        }
        .gift-screen-active { opacity: 1 !important; pointer-events: auto !important; }

        .gift-container { text-align: center; position: relative; animation: floatGift 3.5s infinite ease-in-out alternate; }
        .big-gift-box {
            position: relative; width: 120px; height: 120px; margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #00bfff 0%, #0044cc 100%);
            border-radius: 18px; box-shadow: 0 0 40px rgba(0, 191, 255, 0.6);
        }
        .big-gift-box::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 22px; height: 100%; background: linear-gradient(to right, #00ffff, #b3ffff, #00ffff);
        }
        .big-gift-box::after {
            content: ''; position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            width: 100%; height: 22px; background: linear-gradient(to bottom, #00ffff, #b3ffff, #00ffff);
        }
        .gift-bow { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 50px; }

        .click-hint {
            font-size: 1rem; font-weight: 800; color: #b3f0ff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.9); animation: blinkText 1.5s infinite;
        }

        @keyframes floatGift { 0% { transform: translateY(0); } 100% { transform: translateY(-12px); } }
        @keyframes blinkText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .open-box-anim { transform: scale(2.5) !important; opacity: 0 !important; visibility: hidden !important; }
        .hidden-content { opacity: 0; pointer-events: none; transition: opacity 1.5s ease 0.4s; }
        .reveal-active { opacity: 1 !important; pointer-events: auto !important; }

        #rising-text-container, #petals-container, #fireworks-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
        }
        #rising-text-container { z-index: 2; }
        #petals-container { z-index: 4; }
        #fireworks-canvas { z-index: 5; }

        .floating-text-item { position: absolute; white-space: nowrap; font-weight: 800; animation: riseUp var(--duration) linear infinite; }
        .floating-text-item.bg-layer { color: rgba(0, 90, 180, 0.3); font-size: var(--size); z-index: 1; }
        .floating-text-item.fg-layer { color: #00bfff; font-size: var(--size); text-shadow: 0 0 10px #0080ff; z-index: 3; }

        .floating-photo-item {
            position: absolute; width: 45px; height: 45px; border-radius: 50%;
            border: 2px solid #00bfff; box-shadow: 0 0 10px rgba(0, 191, 255, 0.6);
            object-fit: cover; animation: riseUp var(--duration) linear infinite; z-index: 2;
        }

        @keyframes riseUp {
            0% { transform: translateY(105vh) rotate(var(--rot)); opacity: 0; }
            8%, 92% { opacity: var(--max-op, 0.8); } 
            100% { transform: translateY(-15vh) rotate(var(--rot)); opacity: 0; }
        }

        .petal {
            position: absolute; background: radial-gradient(circle, #00bfff 0%, #004499 60%, #001122 100%);
            border-radius: 50% 50% 60% 40%; animation: fallDown var(--fall-duration) linear infinite;
        }

        @keyframes fallDown {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10%, 90% { opacity: 0.8; } 100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
        }

        .touch-emoji {
            position: fixed; pointer-events: none; z-index: 999; font-size: 22px;
            animation: emojiPop 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes emojiPop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            50% { opacity: 1; transform: translate(-50%, -60px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -100px) scale(0.3); }
        }

        .scene {
            position: relative; z-index: 10; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; transform-style: preserve-3d;
        }

        .card-3d {
            position: relative; text-align: center; transform-style: preserve-3d;
            background: rgba(0, 5, 15, 0.82); padding: 18px 15px; border-radius: 18px;
            border: 1px solid rgba(0, 191, 255, 0.4); box-shadow: 0 0 30px rgba(0, 100, 200, 0.6);
            backdrop-filter: blur(5px); width: 80vw; max-width: 270px;
        }

        .photo-frame {
            width: 85px; height: 85px; margin: 0 auto 10px auto;
            border-radius: 50%; border: 3px solid #00bfff;
            box-shadow: 0 0 15px #00bfff; overflow: hidden;
            transform: translateZ(30px); background: #001122;
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .wish-title { font-size: 1.2rem; font-weight: 900; color: #fff; text-shadow: 0 0 8px #00bfff; transform: translateZ(25px); }
        .target-name {
            font-size: 1.8rem; font-weight: 900;
            background: linear-gradient(45deg, #00bfff, #00ffff, #b3f0ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.7); transform: translateZ(40px); margin-bottom: 5px;
        }

        .custom-message { font-size: 0.78rem; color: #e6f7ff; transform: translateZ(20px); margin-bottom: 12px; line-height: 1.3; }
        .action-btn {
            background: linear-gradient(45deg, #00bfff, #0044cc); color: #fff;
            border: none; padding: 7px 15px; border-radius: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.4); transform: translateZ(30px); font-size: 0.8rem;
        }

        .modal {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: #001020; border: 2px solid #00bfff; padding: 18px; border-radius: 16px;
            text-align: center; width: 85vw; max-width: 280px; color: #fff; box-shadow: 0 0 25px #00bfff;
            font-size: 0.85rem; line-height: 1.4;
        }
        .close-btn { margin-top: 12px; background: #00bfff; color: #fff; border: none; padding: 5px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- LOCK SCREEN SYSTEM (EMPTY SCRATCH BOX) -->
    <div id="lock-screen">
        <div class="canvas-container">
            <canvas id="scratchCanvas" width="230" height="230"></canvas>
        </div>
        <button class="clear-btn" onclick="resetCanvas()">다시 칠하기 (Reset)</button>
    </div>

    <!-- GIFT SCREEN -->
    <div id="gift-screen" onclick="openSurpriseGift()">
        <div class="gift-container">
            <div class="big-gift-box"><div class="gift-bow">🎁</div></div>
            <div class="click-hint">একটি সারপ্রাইজ তোমার জন্য অপেক্ষা করছে!<br>✨ বক্সে ক্লিক করো ✨</div>
        </div>
    </div>

    <!-- MAIN EXPERIENCE -->
    <div id="main-experience" class="hidden-content">
        <canvas id="fireworks-canvas"></canvas>
        <div id="rising-text-container"></div>
        <div id="petals-container"></div>

        <div class="scene" id="scene">
            <div class="card-3d">
                <div class="photo-frame">
                    <img id="userMainPhoto" src="" alt="Profile Photo">
                </div>

                <h2 class="wish-title">HAPPY BIRTHDAY</h2>
                <h1 class="target-name" id="mainName"></h1>
                <p class="custom-message" id="mainMsg"></p>
                
                <button class="action-btn" onclick="openSurprise()">🎁 বিশেষ বার্তা</button>
            </div>
        </div>
    </div>

    <div class="modal" id="surpriseModal">
        <div class="modal-content">
            <h3 style="color: #00bfff; margin-bottom: 8px; font-size: 1rem;">💙 বিশেষ কবিতা 💙</h3>
            <p id="modalText"></p>
            <button class="close-btn" onclick="closeSurprise()">বন্ধ করুন</button>
        </div>
    </div>

        const targetName = "EMON";
        const targetMessage = "তোমার জীবনের প্রতিটি মুহূর্ত নীল আকাশের মতো বিশাল ও সুন্দর হয়ে উঠুক! 💙✨";

        document.getElementById('userMainPhoto').src = userImageSrc;
        document.getElementById('mainName').innerText = targetName;
        document.getElementById('mainMsg').innerText = targetMessage;

        // STRICT SCRATCH & CHECK SYSTEM (NO TEXT ON CANVAS)
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let isUnlocked = false;

        function initCanvas() {
            // Completely solid blue cover without any text
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#0033aa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 35;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        initCanvas();

        function resetCanvas() {
            if (isUnlocked) return;
            initCanvas();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (isUnlocked) return;
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (e.cancelable) e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing || isUnlocked) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            checkScratchProgress();
            if (e.cancelable) e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Real-time pixel checking: checks how much area is cleared
        function checkScratchProgress() {
            if (isUnlocked) return;
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let transparentPixels = 0;
            const totalPixels = imgData.data.length / 4;

            // Sample every 10th pixel for performance optimization
            for (let i = 3; i < imgData.data.length; i += 40) {
                if (imgData.data[i] < 128) { // If cleared/transparent
                    transparentPixels++;
                }
            }

            const sampledTotal = totalPixels / 10;
            // Unlock only if more than 35% to 40% of the box is genuinely scratched/rubbed
            if (transparentPixels > sampledTotal * 0.38) {
                isUnlocked = true;
                unlockGiftScreen();
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function unlockGiftScreen() {
            const lockScreen = document.getElementById('lock-screen');
            const giftScreen = document.getElementById('gift-screen');
            
            lockScreen.style.opacity = '0';
            lockScreen.style.transform = 'scale(1.2)';
            
            setTimeout(() => {
                lockScreen.style.display = 'none';
                giftScreen.classList.add('gift-screen-active');
            }, 800);
        }

        // GIFT OPENING
        let isOpened = false;
        function openSurpriseGift() {
            if (isOpened) return;
            isOpened = true;

            const giftScreen = document.getElementById('gift-screen');
            const mainExp = document.getElementById('main-experience');

            giftScreen.classList.add('open-box-anim');
            mainExp.classList.add('reveal-active');
            startFireworks();
        }

        // TOUCH TRAIL (BLUE EMOJIS)
        const emojis = ['💙', '💎', '🌊', '✨', '🌀', '🦋', '🔷'];
        function spawnTrailEmoji(x, y) {
            const el = document.createElement('div');
            el.classList.add('touch-emoji');
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        let lastMove = 0;
        window.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove > 40) { spawnTrailEmoji(e.clientX, e.clientY); lastMove = now; }
        });
        window.addEventListener('touchmove', (e) => {
            const now = Date.now();
            if (now - lastMove > 40) {
                const touch = e.touches[0];
                spawnTrailEmoji(touch.clientX, touch.clientY);
                lastMove = now;
            }
        }, { passive: true });

        // RISING TEXT AND FLOATING IMAGES
        const textContainer = document.getElementById('rising-text-container');
        const textPhrases = ["HAPPY BIRTHDAY", targetName, "💙"];
        
        for (let i = 0; i < 30; i++) {
            const el = document.createElement('div');
            const isForeground = Math.random() > 0.5;
            el.classList.add('floating-text-item', isForeground ? 'fg-layer' : 'bg-layer');
            el.innerText = textPhrases[Math.floor(Math.random() * textPhrases.length)];
            el.style.left = `${Math.random() * 92}vw`;
            el.style.setProperty('--size', isForeground ? `${Math.floor(Math.random() * 6 + 14)}px` : `${Math.floor(Math.random() * 4 + 10)}px`);
            el.style.setProperty('--duration', `${Math.random() * 3.5 + 4.5}s`);
            el.style.setProperty('--rot', `${Math.random() * 26 - 13}deg`);
            el.style.animationDelay = `${Math.random() * 6}s`;
            textContainer.appendChild(el);
        }

        for (let i = 0; i < 10; i++) {
            const imgEl = document.createElement('img');
            imgEl.classList.add('floating-photo-item');
            imgEl.src = userImageSrc;
            imgEl.style.left = `${Math.random() * 88}vw`;

            imgEl.style.setProperty('--rot', `${Math.random() * 30 - 15}deg`);
            imgEl.style.setProperty('--max-op', `${Math.random() * 0.4 + 0.4}`);
            imgEl.style.animationDelay = `${Math.random() * 5}s`;
            textContainer.appendChild(imgEl);
        }

        // FALLING BLUE PETALS
        const petalsContainer = document.getElementById('petals-container');
        for (let i = 0; i < 70; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const width = Math.random() * 6 + 8;
            petal.style.width = `${width}px`;
            petal.style.height = `${width * 1.4}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.setProperty('--fall-duration', `${Math.random() * 3 + 4}s`);
            petal.style.animationDelay = `${Math.random() * 6}s`;
            petalsContainer.appendChild(petal);
        }

        // BLUE FIREWORKS
        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#00bfff', '#00ffff', '#b3f0ff', '#ffffff', '#0044cc'];

            function createFirework() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.5);
                for (let i = 0; i < 30; i++) {
                    particles.push({
                        x: x, y: y, color: colors[Math.floor(Math.random() * colors.length)],
                        radius: Math.random() * 2.5 + 1, vx: (Math.random() - 0.5) * 7,
                        vy: (Math.random() - 0.5) * 7, alpha: 1
                    });
                }
            }
            for(let i=0; i<5; i++) setTimeout(createFirework, i * 300);

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.015;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color; ctx.fill();
                    if (p.alpha <= 0) particles.splice(index, 1);
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        }
        function closeSurprise() { document.getElementById('surpriseModal').style.display = 'none'; }

        // 3D TILT EFFECT
        const scene = document.getElementById('scene');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
            scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const xAxis = (window.innerWidth / 2 - touch.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - touch.pageY) / 25;
            scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }, { passive: true });
    </script>
</body>
</html>

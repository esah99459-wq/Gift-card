<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Birthday Gift Reveal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1000px;
            touch-action: none;
        }

        #gift-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #3d0010 0%, #050002 85%);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.8s ease;
        }

        .gift-container { text-align: center; position: relative; animation: floatGift 3.5s infinite ease-in-out alternate; }
        .big-gift-box {
            position: relative; width: 180px; height: 180px; margin: 0 auto 25px auto;
            background: linear-gradient(135deg, #ff0055 0%, #990022 100%);
            border-radius: 24px; box-shadow: 0 0 60px rgba(255, 0, 85, 0.6);
        }
        .big-gift-box::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 32px; height: 100%; background: linear-gradient(to right, #ffd700, #fff099, #ffd700);
        }
        .big-gift-box::after {
            content: ''; position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            width: 100%; height: 32px; background: linear-gradient(to bottom, #ffd700, #fff099, #ffd700);
        }
        .gift-bow { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); font-size: 70px; }

        .click-hint {
            font-size: 1.4rem; font-weight: 800; color: #ffb3c1;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.9); animation: blinkText 1.5s infinite;
        }

        @keyframes floatGift { 0% { transform: translateY(0); } 100% { transform: translateY(-18px); } }
        @keyframes blinkText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .open-box-anim { transform: scale(2.5) !important; opacity: 0 !important; visibility: hidden !important; }
        .hidden-content { opacity: 0; pointer-events: none; transition: opacity 1.5s ease 0.4s; }
        .reveal-active { opacity: 1 !important; pointer-events: auto !important; }

        #rising-text-container, #petals-container, #fireworks-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
        }
        #rising-text-container { z-index: 2; }
        #petals-container { z-index: 4; }
        #fireworks-canvas { z-index: 5; }

        /* FLOATING TEXT AND IMAGE ANIMATION */
        .floating-text-item { position: absolute; white-space: nowrap; font-weight: 800; animation: riseUp var(--duration) linear infinite; }
        .floating-text-item.bg-layer { color: rgba(180, 0, 40, 0.4); font-size: var(--size); z-index: 1; }
        .floating-text-item.fg-layer { color: #ff3366; font-size: var(--size); text-shadow: 0 0 12px #ff0055; z-index: 3; }

        .floating-photo-item {
            position: absolute;
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
            object-fit: cover;
            animation: riseUp var(--duration) linear infinite;
            z-index: 2;
        }

        @keyframes riseUp {
            0% { transform: translateY(105vh) rotate(var(--rot)); opacity: 0; }
            8%, 92% { opacity: var(--max-op, 1); } 
            100% { transform: translateY(-15vh) rotate(var(--rot)); opacity: 0; }
        }

        .petal {
            position: absolute; background: radial-gradient(circle, #ff0044 0%, #a00020 60%, #1f0005 100%);
            border-radius: 50% 50% 60% 40%; animation: fallDown var(--fall-duration) linear infinite;
        }

        @keyframes fallDown {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10%, 90% { opacity: 0.9; } 100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
        }

        .touch-emoji {
            position: fixed; pointer-events: none; z-index: 999; font-size: 26px;
            animation: emojiPop 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes emojiPop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            50% { opacity: 1; transform: translate(-50%, -80px) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -130px) scale(0.4); }
        }

        .scene {
            position: relative; z-index: 10; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; transform-style: preserve-3d;
        }

        .card-3d {
            position: relative; text-align: center; transform-style: preserve-3d;
            background: rgba(10, 0, 3, 0.88); padding: 30px 25px; border-radius: 24px;
            border: 1px solid rgba(220, 0, 50, 0.5); box-shadow: 0 0 50px rgba(150, 0, 30, 0.7);
            backdrop-filter: blur(8px); max-width: 90vw; width: 380px;
        }

        .photo-frame {
            width: 140px; height: 140px; margin: 0 auto 15px auto;
            border-radius: 50%; border: 4px solid #ff0055;
            box-shadow: 0 0 25px #ff0055; overflow: hidden;
            transform: translateZ(60px); background: #22000a;
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .wish-title { font-size: 2.2rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px #ff0055; transform: translateZ(50px); }
        .target-name {
            font-size: 3.2rem; font-weight: 900;
            background: linear-gradient(45deg, #ff4d6d, #ff0235, #ffb3c1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 60, 0.8); transform: translateZ(80px); margin-bottom: 8px;
        }

        .custom-message { font-size: 1rem; color: #ffe6ea; transform: translateZ(35px); margin-bottom: 18px; }
        .action-btn {
            background: linear-gradient(45deg, #ff0055, #990022); color: #fff;
            border: none; padding: 10px 22px; border-radius: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); transform: translateZ(60px);
        }

        .modal {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1a0008; border: 2px solid #ff0055; padding: 25px; border-radius: 20px;
            text-align: center; max-width: 380px; color: #fff; box-shadow: 0 0 40px #ff0055;
        }
        .close-btn { margin-top: 15px; background: #ff0055; color: #fff; border: none; padding: 8px 18px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="gift-screen" onclick="openSurpriseGift()">
        <div class="gift-container">
            <div class="big-gift-box"><div class="gift-bow">🎀</div></div>
            <div class="click-hint">একটি সারপ্রাইজ তোমার জন্য অপেক্ষা করছে!<br>✨ বক্সে ক্লিক করো ✨</div>
        </div>
    </div>

    <div id="main-experience" class="hidden-content">
        <canvas id="fireworks-canvas"></canvas>
        <div id="rising-text-container"></div>
        <div id="petals-container"></div>

        <div class="scene" id="scene">
            <div class="card-3d">
                <div class="photo-frame">
                    <img id="userMainPhoto" src="" alt="Profile Photo">
                </div>

                <h2 class="wish-title">HAPPY BIRTHDAY</h2>
                <h1 class="target-name" id="mainName"></h1>
                <p class="custom-message" id="mainMsg"></p>
                
                <button class="action-btn" onclick="openSurprise()">🎁 বিশেষ বার্তা</button>
            </div>
        </div>
    </div>

    <div class="modal" id="surpriseModal">
        <div class="modal-content">
            <h3 style="color: #ff3366; margin-bottom: 10px;">💖 বিশেষ কবিতা 💖</h3>
            <p id="modalText"></p>
            <button class="close-btn" onclick="closeSurprise()">বন্ধ করুন</button>
        </div>
    </div>

        const targetName = "EMON";
        const targetMessage = "তোমার জীবনের প্রতিটি মুহূর্ত গোলাপের মতো সুন্দর এবং সুবাসিত হয়ে উঠুক! 🌹✨";

        document.getElementById('userMainPhoto').src = userImageSrc;
        document.getElementById('mainName').innerText = targetName;
        document.getElementById('mainMsg').innerText = targetMessage;

        let isOpened = false;
        function openSurpriseGift() {
            if (isOpened) return;
            isOpened = true;

            const giftScreen = document.getElementById('gift-screen');
            const mainExp = document.getElementById('main-experience');

            giftScreen.classList.add('open-box-anim');
            mainExp.classList.add('reveal-active');
            startFireworks();
        }

        // TOUCH & MOUSE TRAIL
        const emojis = ['🌹', '💖', '💕', '💗', '✨', '🌸', '❤️'];
        function spawnTrailEmoji(x, y) {
            const el = document.createElement('div');
            el.classList.add('touch-emoji');
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        let lastMove = 0;
        window.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove > 40) { spawnTrailEmoji(e.clientX, e.clientY); lastMove = now; }
        });
        window.addEventListener('touchmove', (e) => {
            const now = Date.now();
            if (now - lastMove > 40) {
                const touch = e.touches[0];
                spawnTrailEmoji(touch.clientX, touch.clientY);
                lastMove = now;
            }
        }, { passive: true });

        // RISING TEXT AND FLOATING IMAGES
        const textContainer = document.getElementById('rising-text-container');
        const textPhrases = ["HAPPY BIRTHDAY", targetName, "🌹"];
        
        for (let i = 0; i < 35; i++) {
            const el = document.createElement('div');
            const isForeground = Math.random() > 0.5;
            el.classList.add('floating-text-item', isForeground ? 'fg-layer' : 'bg-layer');
            el.innerText = textPhrases[Math.floor(Math.random() * textPhrases.length)];
            el.style.left = `${Math.random() * 95}vw`;
            el.style.setProperty('--size', isForeground ? `${Math.floor(Math.random() * 8 + 20)}px` : `${Math.floor(Math.random() * 6 + 12)}px`);
            el.style.setProperty('--duration', `${Math.random() * 3.5 + 4.5}s`);
            el.style.setProperty('--rot', `${Math.random() * 26 - 13}deg`);
            el.style.animationDelay = `${Math.random() * 6}s`;
            textContainer.appendChild(el);
        }

        // RISING FLOATING PHOTOS
        for (let i = 0; i < 12; i++) {
            const imgEl = document.createElement('img');
            imgEl.classList.add('floating-photo-item');
            imgEl.src = userImageSrc;
            imgEl.style.left = `${Math.random() * 90}vw`;
            const size = Math.floor(Math.random() * 30 + 50);
            imgEl.style.width = `${size}px`;
            imgEl.style.height = `${size}px`;
            imgEl.style.setProperty('--duration', `${Math.random() * 4 + 5}s`);
            imgEl.style.setProperty('--rot', `${Math.random() * 30 - 15}deg`);
            imgEl.style.setProperty('--max-op', `${Math.random() * 0.4 + 0.4}`);
            imgEl.style.animationDelay = `${Math.random() * 5}s`;
            textContainer.appendChild(imgEl);
        }

        // FALLING PETALS
        const petalsContainer = document.getElementById('petals-container');
        for (let i = 0; i < 90; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            const width = Math.random() * 8 + 10;
            petal.style.width = `${width}px`;
            petal.style.height = `${width * 1.4}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.setProperty('--fall-duration', `${Math.random() * 3 + 4}s`);
            petal.style.animationDelay = `${Math.random() * 6}s`;
            petalsContainer.appendChild(petal);
        }

        // FIREWORKS
        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ff0055', '#ff4d6d', '#ffb3c1', '#ffffff', '#ffcc00'];

            function createFirework() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.5);
                for (let i = 0; i < 35; i++) {
                    particles.push({
                        x: x, y: y, color: colors[Math.floor(Math.random() * colors.length)],
                        radius: Math.random() * 3 + 1, vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8, alpha: 1
                    });
                }
            }
            for(let i=0; i<5; i++) setTimeout(createFirework, i * 300);

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx; p.y += p.vy; p.alpha -= 0.015;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color; ctx.fill();
                    if (p.alpha <= 0) particles.splice(index, 1);
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function openSurprise() {
            document.getElementById('modalText').innerHTML = `
                একরাশ লাল গোলাপের সুবাস নিয়ে,<br>
                আসুক ফিরে এই দিন বারবার হিয়ে।<br>
                হাসিতে ভরে উঠুক তোমার প্রতিটি ভোর,<br>
                খুশিতে কাটুক জীবন, কাটুক আঁধার ঘোর।<br><br>
                <b>শুভ জন্মদিন, EMON! 🌹✨</b>
            `;
            document.getElementById('surpriseModal').style.display = 'flex';
        }
        function closeSurprise() { document.getElementById('surpriseModal').style.display = 'none'; }

        // 3D TILT EFFECT
        const scene = document.getElementById('scene');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
            scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const xAxis = (window.innerWidth / 2 - touch.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - touch.pageY) / 25;
            scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        }, { passive: true });
    </script>
